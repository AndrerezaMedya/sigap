steps:
  # 1. Build the container image using Dockerfile
  # We pass the NEXT_PUBLIC_GCP_API_KEY as a build argument
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--build-arg', 'NEXT_PUBLIC_GCP_API_KEY=${_NEXT_PUBLIC_GCP_API_KEY}',
      '-t', 'gcr.io/$PROJECT_ID/sigap-web',
      '.'
    ]

  # 2. Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sigap-web']

  # 3. Deploy the container to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'sigap-web',
      '--image', 'gcr.io/$PROJECT_ID/sigap-web',
      '--region', 'asia-southeast2',
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]

images:
  - 'gcr.io/$PROJECT_ID/sigap-web'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _NEXT_PUBLIC_GCP_API_KEY: "dummy_key_if_forgotten"
